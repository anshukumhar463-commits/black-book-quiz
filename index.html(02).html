<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL Vocabulary Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        .question {
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            background: #e0e0e0;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .options li:hover {
            background: #d0d0d0;
        }
        .options li.correct {
            background: #4caf50;
            color: white;
        }
        .options li.incorrect {
            background: #f44336;
            color: white;
        }
        .options li.selected {
            background: #2196f3;
            color: white;
        }
        #result-container {
            text-align: center;
            display: none;
        }
        #doraemon-canvas {
            width: 200px;
            height: 250px;
            margin-top: 20px;
        }
        #score, #motivation {
            font-size: 1.3em;
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz-container">
            <p id="progress"></p>
            <div class="question" id="question-text"></div>
            <ul class="options" id="options-list"></ul>
            <button id="next-btn" style="display:none;" onclick="nextQuestion()">Next Question</button>
        </div>

        <div id="result-container">
            <canvas id="doraemon-canvas" width="200" height="250"></canvas>
            <p id="score"></p>
            <p id="motivation"></p>
            <h3>Correct Answers:</h3>
            <div id="answers-summary"></div>
            <button onclick="restartQuiz()">Restart Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            // Example question, replace with data from images
            {
                phrase: "The scientific study of diseases",
                options: ["Patricide", "Pathology", "Pecuniary", "Pedestrian"],
                answer: "Pathology"
            },
            {
                phrase: "One who has suddenly become rich but lacks social grace",
                options: ["Pauper", "Pedant", "Parvenu", "Pardon"],
                answer: "Parvenu"
            },
             {
                phrase: "A punishment imposed for breaking a law, rule, or contract",
                options: ["Penance", "Perjury", "Penalty", "Pendant"],
                answer: "Penalty"
            },
             {
                phrase: "The state of feeling sorry for wrongdoing",
                options: ["Penury", "Penitence", "Perpetual", "Phobia"],
                answer: "Penitence"
            },
             {
                phrase: "Deep in thought",
                options: ["Perceptive", "Perennial", "Perfidy", "Pensive"],
                answer: "Pensive"
            },
             {
                phrase: "Lasting for an indefinitely long time",
                options: ["Perceptual", "Perennial", "Perfunctory", "Placebo"],
                answer: "Perennial"
            },
             {
                phrase: "A person who collects or studies stamps",
                options: ["Philatelist", "Phonetics", "Philistine", "Pioneer"],
                answer: "Philatelist"
            },
             {
                phrase: "The collection and study of postage stamps",
                options: ["Philosophy", "Philately", "Physiology", "Pillage"],
                answer: "Philately"
            },
             {
                phrase: "Illegally copied without the owner's permission",
                options: ["Pillaged", "Pivotal", "Pillaged", "Pirated"],
                answer: "Pirated"
            },
             {
                phrase: "Playing a crucial role",
                options: ["Pecuniary", "Pivotal", "Placid", "Perjury"],
                answer: "Pivotal"
            },
            // ... add 40 more questions here, extracting text from the provided images
        ];

        // Shuffle quizData array to randomize questions
        shuffle(quizData);
        const finalQuizData = quizData.slice(0, 50); // Get first 50 questions

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        const totalMarks = 100;

        const quizContainer = document.getElementById('quiz-container');
        const questionText = document.getElementById('question-text');
        const optionsList = document.getElementById('options-list');
        const progress = document.getElementById('progress');
        const nextBtn = document.getElementById('next-btn');
        const resultContainer = document.getElementById('result-container');
        const canvas = document.getElementById('doraemon-canvas');
        const scoreDisplay = document.getElementById('score');
        const motivationText = document.getElementById('motivation');
        const answersSummary = document.getElementById('answers-summary');

        function loadQuestion() {
            const currentQuestion = finalQuizData[currentQuestionIndex];
            progress.innerText = `Question ${currentQuestionIndex + 1} / ${finalQuizData.length}`;
            questionText.innerText = currentQuestion.phrase;
            optionsList.innerHTML = '';
            selectedOptionIndex = null;
            nextBtn.style.display = 'none';

            currentQuestion.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.innerText = option;
                li.onclick = () => selectOption(index);
                optionsList.appendChild(li);
            });
        }

        function selectOption(index) {
            if (selectedOptionIndex !== null) return; // Prevent changing after selection

            selectedOptionIndex = index;
            const currentQuestion = finalQuizData[currentQuestionIndex];
            const optionsLi = optionsList.getElementsByTagName('li');

            if (currentQuestion.options[index] === currentQuestion.answer) {
                optionsLi[index].classList.add('correct');
                score++;
            } else {
                optionsLi[index].classList.add('incorrect');
                // Highlight correct option
                const correctIndex = currentQuestion.options.indexOf(currentQuestion.answer);
                optionsLi[correctIndex].classList.add('correct');
            }
            nextBtn.style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < finalQuizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function getMotivation(percentage) {
             if (percentage >= 100) return "Hurrey! Unbelievable achievement! Mastermind, keep conquering peaks like a pro!";
             if (percentage >= 99) return "Phenomenal performance! You've almost touched perfection. Keep shining, super scholar!";
             if (percentage >= 98) return "Spectacular score! Your dedication is truly inspiring. Fly high, top achiever!";
             if (percentage >= 97) return "Awesome! You've cracked it with top honors. A spectacular success indeed! Keep going, champ!";
             if (percentage >= 96) return "Outstanding result! Your hard work is paving the way for great things. Fantastic, keep it up!";
             if (percentage >= 95) return "Brilliant! You've secured an elite score. Your knowledge is exemplary. Excellent, keep thriving!";
             if (percentage >= 94) return "Superb! A massive score. You're definitely heading for grand success. Great work, keep pushing!";
             if (percentage >= 93) return "Remarkable achievement! This score proves your excellence. Outstanding, keep striving further!";
             if (percentage >= 92) return "Great performance! A very strong score that marks your brilliance. Excellent, keep ascending!";
             if (percentage >= 91) return "Wonderful score! You are very close to reaching excellence. Keep going strong!";
             if (percentage >= 90) return "Excellent result! You've mastered the subject beautifully. Keep climbing higher, you're doing great!";
            return "Good job! Keep learning and practice more. Success is near, stay motivated!";
        }

        function drawDoraemon(percentage) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear previous

            const cx = 100;
            const cy = 130;

            // --- Body ---
            ctx.fillStyle = '#1e88e5'; // Blue body
            ctx.beginPath();
            ctx.ellipse(cx, cy, 70, 75, 0, 0, 2 * Math.PI);
            ctx.fill();

            // --- White Tummy area ---
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 20, 50, 45, 0, 0, 2 * Math.PI);
            ctx.fill();

            // --- Head ---
            ctx.fillStyle = '#1e88e5'; // Blue head
            ctx.beginPath();
            ctx.ellipse(cx, cy - 80, 60, 55, 0, 0, 2 * Math.PI);
            ctx.fill();

            // --- Face details (eyes, nose, mouth, whiskers) ---
            // Draw eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(cx - 20, cy - 90, 15, 20, 0, 0, 2 * Math.PI); // Left Eye
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 20, cy - 90, 15, 20, 0, 0, 2 * Math.PI); // Right Eye
            ctx.fill();
            // Draw pupils
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(cx - 20, cy - 90, 6, 8, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 20, cy - 90, 6, 8, 0, 0, 2 * Math.PI);
            ctx.fill();

            // Red Nose
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 65, 10, 10, 0, 0, 2 * Math.PI);
            ctx.fill();

            // Mouth line
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy - 50);
            ctx.bezierCurveTo(cx - 10, cy - 40, cx + 10, cy - 40, cx + 20, cy - 50);
            ctx.stroke();

            // Whiskers
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(cx - 35, cy - 65); ctx.lineTo(cx - 65, cy - 75); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx - 35, cy - 60); ctx.lineTo(cx - 65, cy - 60); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx - 35, cy - 55); ctx.lineTo(cx - 65, cy - 45); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + 35, cy - 65); ctx.lineTo(cx + 65, cy - 75); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + 35, cy - 60); ctx.lineTo(cx + 65, cy - 60); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + 35, cy - 55); ctx.lineTo(cx + 65, cy - 45); ctx.stroke();

            // --- Red collar ---
            ctx.fillStyle = '#f44336';
            ctx.fillRect(cx - 50, cy - 20, 100, 10);

            // --- Golden Bell ---
            ctx.fillStyle = '#ffd600';
            ctx.beginPath();
            ctx.arc(cx, cy - 10, 15, 0, 2 * Math.PI);
            ctx.fill();
             ctx.fillStyle = '#000'; // Bell line
            ctx.fillRect(cx - 10, cy - 10, 20, 2);
             ctx.beginPath(); ctx.arc(cx, cy - 2, 3, 0, 2 * Math.PI); ctx.fill(); // Bell hole

            // --- Pocket ---
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(cx, cy + 30, 35, 30, 0, Math.PI, 0); // Bottom curve
            ctx.stroke();
             ctx.beginPath();
             ctx.moveTo(cx - 35, cy + 30);
             ctx.lineTo(cx + 35, cy + 30);
             ctx.stroke();

            // --- Hands and Legs ---
            // Blue Hands
            ctx.fillStyle = '#1e88e5';
            ctx.beginPath(); ctx.ellipse(cx - 65, cy + 10, 10, 10, 0, 0, 2 * Math.PI); ctx.fill(); // Left hand ball
            ctx.beginPath(); ctx.ellipse(cx + 65, cy + 10, 10, 10, 0, 0, 2 * Math.PI); ctx.fill(); // Right hand ball
            // Blue Legs
            ctx.beginPath(); ctx.ellipse(cx - 30, cy + 85, 20, 15, 0, 0, 2 * Math.PI); ctx.fill(); // Left leg
            ctx.beginPath(); ctx.ellipse(cx + 30, cy + 85, 20, 15, 0, 0, 2 * Math.PI); ctx.fill(); // Right leg
             // Feet
             ctx.fillStyle = '#fff';
             ctx.beginPath(); ctx.ellipse(cx - 30, cy + 95, 22, 10, 0, 0, 2 * Math.PI); ctx.fill(); // Left foot
             ctx.beginPath(); ctx.ellipse(cx + 30, cy + 95, 22, 10, 0, 0, 2 * Math.PI); ctx.fill(); // Right foot
        }

        function showResults() {
            quizContainer.style.display = 'none';
            resultContainer.style.display = 'block';
            const percentage = (score / finalQuizData.length) * totalMarks;
            scoreDisplay.innerText = `You scored: ${score} / ${finalQuizData.length} (${percentage.toFixed(1)}%)`;
            motivationText.innerText = getMotivation(percentage);

            drawDoraemon(percentage);

            let summaryHTML = '';
            finalQuizData.forEach((q, idx) => {
                summaryHTML += `<p><strong>Q${idx + 1}: ${q.phrase}</strong><br>Correct Answer: <span style="color:green">${q.answer}</span></p>`;
            });
            answersSummary.innerHTML = summaryHTML;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            shuffle(finalQuizData);
            quizContainer.style.display = 'block';
            resultContainer.style.display = 'none';
            loadQuestion();
        }

        // Initialize quiz
        loadQuestion();
    </script>
</body>
</html>
